[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-analyst-copilot"
version = "0.1.0"
description = "Auditable read-only SQL assistant for retail credit analysts"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "psycopg[binary]>=3.2,<4",
  "langgraph>=1.2,<2", "sqlglot>=30,<31", "pydantic-settings>=2,<3",
  "httpx>=0.28,<1", "streamlit>=1.42,<2", "pandas>=2.2,<4", "plotly>=6,<8"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[project.scripts]
credit-copilot = "credit_copilot.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires dedicated PostgreSQL test database"]
